<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
  <div class="container"></div>
    <div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="card shadow-lg" style="background-color: rgba(255, 255, 255, 0.5);">
      <div class="card-header">
        <h3>Enter Stock Data</h3>
      </div>
      <div class="card-body">
        <form method="POST" action="/get_stock_data">
        <div class="mb-3">
          <label for="stockdata" class="form-label">Stock Symbol:</label>
          <input list="stock-symbols" name="stockdata" id="stockdata" class="form-control" required>
          <datalist id="stock-symbols">
          <option value="GOOG">Google</option>
          <option value="NFLX">Netflix</option>
          <option value="GOLD">Gold</option>
          </datalist>
        </div>

        <div class="mb-3">
          <label for="start_date" class="form-label">Start Date:</label>
          <input type="date" name="start_date" id="start_date" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="end_date" class="form-label">End Date:</label>
          <input type="date" name="end_date" id="end_date" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="interval" class="form-label">Interval:</label>
          <select name="interval" id="interval" class="form-select" required>
          <option value="1d">1 Day</option>
          <option value="1wk">1 Week</option>
          <option value="1mo">1 Month</option>
          <option value="5m">5 Minutes</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="events" class="form-label">Events:</label>
          <select name="events" id="events" class="form-select">
          <option value="history">History</option>
          </select>
        </div>

        <button type="submit" class="btn btn-warning w-100">Fetch Data</button>
        </form>
      </div>
      </div>
    </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
